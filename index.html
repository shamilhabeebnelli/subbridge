# Offline engine (worker.js)

Bundled with esbuild into 4-worker.js: @huggingface/transformers 4.3.2 (Apache License 2.0, https://github.com/huggingface/transformers.js/blob/main/LICENSE) and its dependencies, including ONNX Runtime Web (MIT). The runtime WebAssembly file is loaded from cdn.jsdelivr.net when the offline engine is used. Model files are not bundled. They are downloaded from huggingface.co on first use: Xenova/opus-mt-en-hi, -ar, -fr, -es, -zh, -id (ONNX conversions of Helsinki-NLP Opus-MT models, listed as apache-2.0 on their Hugging Face model cards). Experimental Malayalam: akm9191/opus-mt-en-ml-int8-onnx at commit f46c4b34a8b83c8e825de869de16e30fd1029a32, a third-party int8 ONNX conversion (Apache-2.0 per its card) of Helsinki-NLP/opus-mt-en-ml (Apache-2.0). Its tokenizer_config.json is missing, so worker.js supplies the two upstream values (source en, target ml).
